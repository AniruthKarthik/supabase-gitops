name: Generate database schema documentation

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/generate_schema_docs.py'
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: supabase-generate-docs
  cancel-in-progress: false

jobs:
  docs:
    name: Generate Markdown documentation and Mermaid ER diagram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Start isolated PostgreSQL test instance
        run: |
          set -euo pipefail
          docker run --name pg-doc-target -e POSTGRES_PASSWORD=postgres -p 5436:5432 -d postgres:17-alpine
          until docker exec pg-doc-target pg_isready -U postgres >/dev/null 2>&1; do
            sleep 1
          done
          docker exec -i pg-doc-target psql -U postgres -d postgres << 'EOF'
          DO $$
          DECLARE
            r text;
          BEGIN
            FOR r IN SELECT unnest(ARRAY[
              'anon',
              'authenticated',
              'service_role',
              'authenticator',
              'supabase_admin',
              'dashboard_user'
            ]) LOOP
              BEGIN
                EXECUTE format('CREATE ROLE %I NOLOGIN', r);
              EXCEPTION WHEN duplicate_object THEN
                NULL;
              END;
            END LOOP;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS graphql;
          EOF
          echo "Isolated PostgreSQL doc container ready."

      - name: Apply migrations sequentially
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            [ -e "$f" ] || continue
            echo "Applying: $f"
            docker exec -i pg-doc-target psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done
          echo "All migrations applied."

      - name: Generate schema documentation and ER diagram
        run: |
          set -euo pipefail
          mkdir -p docs
          python3 scripts/generate_schema_docs.py pg-doc-target docs/schema.md
          echo "Generated docs/schema.md ($(wc -l < docs/schema.md) lines)"

      - name: Stop and remove test container
        if: always()
        run: |
          docker stop pg-doc-target >/dev/null 2>&1 || true
          docker rm pg-doc-target >/dev/null 2>&1 || true

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-schema-docs-${{ github.sha }}
          path: docs/schema.md
          retention-days: 30

      - name: Commit updated documentation if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schema.md
          if git diff --cached --quiet; then
            echo "Documentation is already up-to-date. Nothing to commit."
            exit 0
          fi
          git commit -m "docs(schema): update database schema docs and ER diagram"
          git pull --rebase --autostash origin master
          git push origin master

      - name: Publish documentation summary
        run: |
          {
            echo "## Schema Documentation Generated"
            echo ""
            echo "Living database schema documentation and ER diagrams updated."
            echo ""
            cat docs/schema.md
          } >> "$GITHUB_STEP_SUMMARY"
