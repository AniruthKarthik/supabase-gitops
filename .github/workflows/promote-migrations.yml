name: Promote migrations to environments

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >
          Type "promote" to deploy migrations through the Staging to Production pipeline.
        required: true
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: supabase-promotion-pipeline
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy migrations to Staging environment
    if: inputs.confirm == 'promote'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.121.0

      - name: Validate Staging environment configuration
        id: validate-staging
        env:
          STAGING_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          PROD_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Validating Staging environment configuration..."

          if [ -z "$STAGING_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL is not configured. Staging and production databases must be configured independently."
            {
              echo "### Target Configuration Error"
              echo ""
              echo "Promotion halted: \`SUPABASE_STAGING_DB_URL\` secret is missing."
              echo "The staging promotion pipeline enforces strict environment isolation and cannot fall back to production."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! [[ "$STAGING_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::SUPABASE_STAGING_DB_URL is not a valid PostgreSQL connection URI."
            exit 1
          fi

          if [ -n "$PROD_URL" ]; then
            STAGING_HOST=$(echo "$STAGING_URL" | sed -E 's|.*@([^:/]+).*|\1|')
            PROD_HOST=$(echo "$PROD_URL" | sed -E 's|.*@([^:/]+).*|\1|')
            if [ "$STAGING_HOST" = "$PROD_HOST" ] && [ -n "$STAGING_HOST" ]; then
              echo "::error::Target Collision: SUPABASE_STAGING_DB_URL points to the same host as SUPABASE_DB_URL ($STAGING_HOST)."
              {
                echo "### Target Collision Detected"
                echo ""
                echo "Promotion halted: Staging points to the same database host as production (\`$STAGING_HOST\`)."
                echo "Staging must target an independent database instance to protect production integrity."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          echo "Staging environment configuration validated successfully."

      - name: Deploy to Staging
        id: staging-deploy
        env:
          TARGET_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          set -euo pipefail

          echo "Backing up staging schema..."
          mkdir -p /tmp/staging
          supabase db dump --db-url "$TARGET_URL" -f /tmp/staging/pre_deploy_staging.sql

          echo "Applying migrations to Staging..."
          supabase db push --db-url "$TARGET_URL" --yes

          echo "Verifying Staging migrations..."
          supabase migration list --db-url "$TARGET_URL" | tee /tmp/staging/migration_state.txt

      - name: Upload staging pre-migration backup
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pre-staging-backup-${{ github.run_id }}
          path: /tmp/staging/pre_deploy_staging.sql
          retention-days: 14

      - name: Publish staging summary
        run: |
          set -euo pipefail
          {
            echo "### Staging Deployment Passed"
            echo ""
            echo "Migrations successfully applied and verified on Staging environment."
            echo '```'
            cat /tmp/staging/migration_state.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Promote migrations to Production environment
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.121.0

      - name: Deploy to Production
        id: production-deploy
        env:
          TARGET_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          echo "Backing up production schema..."
          mkdir -p /tmp/production
          supabase db dump --db-url "$TARGET_URL" -f /tmp/production/pre_deploy_production.sql

          echo "Applying migrations to Production..."
          supabase db push --db-url "$TARGET_URL" --yes

          echo "Verifying Production migrations..."
          supabase migration list --db-url "$TARGET_URL" | tee /tmp/production/migration_state.txt

      - name: Upload production pre-migration backup
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pre-production-backup-${{ github.run_id }}
          path: /tmp/production/pre_deploy_production.sql
          retention-days: 30

      - name: Auto-sync TypeScript types
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p types
          supabase gen types --lang=typescript --db-url "$SUPABASE_DB_URL" --schema public > types/database.types.ts
          echo "Generated types/database.types.ts ($(wc -l < types/database.types.ts) lines)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add types/database.types.ts
          if git diff --cached --quiet; then
            echo "TypeScript types are already up-to-date."
          else
            git commit -m "chore(types): auto-sync database.types.ts after production promotion"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully committed and pushed updated TypeScript types."
          fi

      - name: Publish pipeline summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Multi-Environment Promotion Pipeline Summary"
            echo ""
            echo "| Stage | Status | Environment |"
            echo "|---|---|---|"
            echo "| Staging Deployment | Success | \`staging\` |"
            echo "| Production Deployment | ${{ job.status }} | \`production\` |"
            echo ""
            echo "### Production Migration State"
            echo '```'
            cat /tmp/production/migration_state.txt 2>/dev/null || echo "(no state recorded)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${WEBHOOK_URL:-}" ]; then
            STATUS="${{ job.status }}"
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"text\": \"Promotion Pipeline: ${STATUS} on ${{ github.repository }} (Run ${{ github.run_id }})\"}" \
              "$WEBHOOK_URL" || true
          fi
