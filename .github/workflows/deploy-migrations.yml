name: Deploy database migrations

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Deploy migrations to supabase"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Preview pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee preview.txt
          {
            echo '### Pending migrations'
            echo '```'
            cat preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: preview
    if: inputs.confirm_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Backup schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup_schema.sql

      - uses: actions/upload-artifact@v4
        with:
          name: pre-migration-backup
          path: backup_schema.sql
          retention-days: 7

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
